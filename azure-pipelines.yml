# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

# =========================
# USE NODE.JS
# =========================
- task: UseNode@1
  inputs:
    version: '20.x'
  displayName: 'Install Node.js'

# =========================
# FRONTEND
# =========================
- script: |
    cd client
    npm ci
    npm run build
  displayName: 'Install and build React frontend'

# =========================
# BACKEND
# =========================
- script: |
    cd server
    npm ci
  displayName: 'Install backend dependencies'

# =========================
# VERIFY PROJECT
# =========================
- script: |
    echo "QR Attendance System CI pipeline completed successfully."
    echo "Frontend build completed."
    echo "Backend dependencies installed."
  displayName: 'Verify CI pipeline'