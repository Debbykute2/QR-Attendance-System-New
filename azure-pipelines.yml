# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

# =========================
# USE NODE.JS
# =========================
- task: UseNode@1
  inputs:
    version: '20.x'
  displayName: 'Install Node.js'

# =========================
# FRONTEND
# =========================
- script: |
    cd client
    npm ci
    npm run build
  displayName: 'Install and build React frontend'

# =========================
# BACKEND + API TESTS
# =========================
- script: |
    cd server
    npm ci
    npm test
  displayName: 'Install dependencies and run API tests'

# =========================
# API HEALTH CHECK
# =========================
- script: |
    echo "Checking QR Attendance API..."
    curl --fail https://qr-attendance-server-b77n.onrender.com/api/test
    echo ""
    echo "API health check passed."
  displayName: 'Check live API health'

# =========================
# VERIFY PROJECT
# =========================
- script: |
    echo "======================================"
    echo "QR ATTENDANCE SYSTEM CI PASSED"
    echo "======================================"
    echo "Frontend build completed."
    echo "Backend dependencies installed."
    echo "Automated API tests passed."
    echo "Live API health check passed."
  displayName: 'Verify CI pipeline'