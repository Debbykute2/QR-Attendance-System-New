# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

# =========================
# USE NODE.JS
# =========================
- task: UseNode@1
  inputs:
    version: '20.x'
  displayName: 'Install Node.js'

# =========================
# FRONTEND
# =========================
- script: |
    cd client
    npm ci
    npm run build
  displayName: 'Install and build React frontend'

# =========================
# BACKEND
# =========================
- script: |
    cd server
    npm ci
  displayName: 'Install backend dependencies'

# =========================
# API HEALTH CHECK
# =========================
- script: |
    echo "Checking QR Attendance API..."

    API_URL="https://qr-attendance-server-b77n.onrender.com/api/test"

    echo "Testing: $API_URL"

    RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL")

    echo "API response status: $RESPONSE"

    if [ "$RESPONSE" -ne 200 ]; then
      echo "API health check failed."
      exit 1
    fi

    echo "API health check passed successfully."
  displayName: 'Check deployed API health'

# =========================
# VERIFY PROJECT
# =========================
- script: |
    echo "===================================="
    echo "QR ATTENDANCE SYSTEM CI PASSED"
    echo "===================================="
    echo "Frontend build completed successfully."
    echo "Backend dependencies installed successfully."
    echo "Deployed API is responding successfully."
  displayName: 'Verify CI pipeline'
