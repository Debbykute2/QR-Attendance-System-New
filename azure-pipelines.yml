# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

# =========================
# USE NODE.JS
# =========================
- task: UseNode@1
  inputs:
    version: '20.x'
  displayName: 'Install Node.js'

# =========================
# FRONTEND
# =========================
- script: |
    cd client
    npm ci
    npm run build
  displayName: 'Install and build React frontend'

# =========================
# BACKEND
# =========================
- script: |
    cd server
    npm ci
  displayName: 'Install backend dependencies'

# =========================
# RUN API TESTS
# =========================
- script: |
    cd server
    npm test
  displayName: 'Run automated API tests'

# =========================
# API HEALTH CHECK
# =========================
- script: |
    curl --fail https://qr-attendance-server-b77n.onrender.com/api/test
  displayName: 'Check live API health'

# =========================
# VERIFY PIPELINE
# =========================
- script: |
    echo "======================================"
    echo "QR Attendance System CI completed"
    echo "Frontend build: SUCCESS"
    echo "Backend dependencies: SUCCESS"
    echo "Automated API tests: SUCCESS"
    echo "Live API health check: SUCCESS"
    echo "======================================"
  displayName: 'Verify CI pipeline'